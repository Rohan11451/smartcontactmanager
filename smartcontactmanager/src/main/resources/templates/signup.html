<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base::layout(~{::section})">
<head>
<meta charset="ISO-8859-1">
<title>SignUp Page</title>
</head>
<body>

 <section class="banner">
 
   <div class="container">
      <div class="row">
          <div class="col-md-8 offset-md-2">
          
              <div class="my-card mt-1">
              
               <div th:if="${session.message}" th:classappend="${session.message.type}" class="alert" role="alert">
                    <p class="text-center" th:text="${session.message.content}"></p>
                    <th:block th:text="${#session.removeAttribute('message')}"></th:block>
               </div>
              
                 <div class="container text-center">
                     <img style="width:80px;" th:src="@{/img/membership.png}"/>
                 </div>
              
           <h1 class=" text-center text-primary">Register Here</h1>
               
               <form novalidate action="" th:action="@{/do_register}" method="post" th:object="${user}">
               
                  <!--Name field  -->
                  <div class="form-group">
                         <label for="name_field">Your Name</label>
                         <input type="text"
                                name="name"
                                class="form-control" 
                                th:classappend="${#fields.hasErrors('name') ? 'is-invalid' : ''}"
                                id="name_field"
                                aria-describedby="emailHelp" 
                                placeholder="Enter here" 
                                required
                                th:value="${user.name}"
                                />
                                
                                 <div class="invalid-feedback" th:each="e : ${#fields.errors('name')}" th:text="${e}"></div>
                         
                  </div>
                  <!--Email field  -->
                  <div class="form-group">
                         <label for="email_field">Your Email</label>
                         <input type="email" 
                                name="email"
                                class="form-control" 
                                id="email_field" 
                                aria-describedby="emailHelp" 
                                placeholder="Enter here" 
                                required
                                th:value="${user.email}"
                                />
                         
                  </div>
                         
                  
                  <!--Password field  -->
                  <div class="form-group">
                         <label for="password_field">Password</label>
                         <input type="password" 
                                name="password"
                                class="form-control"
                                id="password_field"
                                aria-describedby="emailHelp" 
                                placeholder="Enter here" 
                                required
                                />
                         
                  </div>
                  
                  <!--User About Field.  -->
                  
                  <div class="form-group">
                       <textarea name="about" th:value="${user.about}"placeholder="Enter Something Yourself" rows="10" class="form-control"></textarea>
                  </div>
                  
                  <!--Terms and Conditions agreement.  -->
                 <div class="form-group form-check text-center">
                     <input type="checkbox" name="agreement" class="form-check-input" id="agreement"/>
                     <label for="agreement">Accept terms and conditions.</label>
                 </div>
                 
                  
                 <div class="container text-center">
                     <button type="submit" class="btn bg-primary text-white">Submit</button>
                     <button type="reset" class="btn btn-warning">Reset</button>
                 </div>
                  
               </form>
              </div>
             
            
          </div>
      </div>
   </div>
 </section>

</body>
</html>
